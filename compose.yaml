
services:
  db:
    image: mariadb:10.11
    container_name: gestion-eau-db
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MARIADB_DATABASE: ${DB_NAME}
      MARIADB_USER: ${DB_USER}
      MARIADB_PASSWORD: ${DB_PASSWORD}
    volumes:
      - gestion_eau_db_data:/var/lib/mysql
      - ./stock.sql:/docker-entrypoint-initdb.d/stock.sql:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      target: production
    container_name: gestion-eau-app
    restart: unless-stopped
    ports:
      - "8081:8080"
    environment:
      DB_HOST: db
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health.php"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  gestion_eau_db_data:
