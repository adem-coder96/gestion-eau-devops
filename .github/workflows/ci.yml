
name: PHP CI and Docker Build

on:
  push:
    branches:
      - main
      - 'feature/**'
  pull_request:
    branches:
      - main

jobs:
  test:
    name: PHP Syntax Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'

      - name: Check PHP syntax
        run: |
          find . -type f -name "*.php" \
            -not -path "./vendor/*" \
            -print0 | xargs -0 -n1 php -l

  build:
    name: Build and Push to Harbor
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to Harbor
        env:
          HARBOR_USERNAME: ${{ secrets.HARBOR_USERNAME }}
          HARBOR_PASSWORD: ${{ secrets.HARBOR_PASSWORD }}
        run: |
          printf '%s' "$HARBOR_PASSWORD" | docker login localhost \
            --username "$HARBOR_USERNAME" \
            --password-stdin

      - name: Build Docker image
        run: |
          docker build -t localhost/devops/gestion-eau:${GITHUB_SHA::7} .

      - name: Push Docker image
        run: |
          docker push localhost/devops/gestion-eau:${GITHUB_SHA::7}
          docker tag localhost/devops/gestion-eau:${GITHUB_SHA::7} localhost/devops/gestion-eau:latest
          docker push localhost/devops/gestion-eau:latest
